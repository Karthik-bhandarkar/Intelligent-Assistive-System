<svg width="945" height="320" viewBox="0 0 945 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>IAVS processing pipeline</title>
<desc>Diagram showing a camera frame going into parallel YOLOv11 sign detection and BLIP scene captioning, both feeding into translation, then text-to-speech, then spoken audio output.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line x1="170" y1="160" x2="205" y2="83" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="160" x2="205" y2="237" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="83" x2="405" y2="152" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="237" x2="405" y2="168" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="160" x2="600" y2="160" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755" y1="160" x2="800" y2="160" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="20" y="132" width="150" height="56" rx="10" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1"/>
<text x="95" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Camera</text>
<text x="95" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">Captures a frame</text>

<rect x="210" y="50" width="150" height="56" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="285" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Detection</text>
<text x="285" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#92400E">YOLOv11 model</text>

<rect x="210" y="214" width="150" height="56" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="285" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Captioning</text>
<text x="285" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#92400E">BLIP model</text>

<rect x="410" y="132" width="140" height="56" rx="10" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1"/>
<text x="480" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Translation</text>
<text x="480" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">5 languages</text>

<rect x="605" y="132" width="150" height="56" rx="10" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1"/>
<text x="680" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Text-to-speech</text>
<text x="680" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">gTTS synthesis</text>

<rect x="805" y="132" width="100" height="56" rx="10" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1"/>
<text x="855" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Audio</text>
<text x="855" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">Spoken aloud</text>
</svg>
